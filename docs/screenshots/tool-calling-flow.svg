<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="flowBg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#flowBg)"/>
  <text x="600" y="70" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">AI Tool Calling Flow</text>

  <rect x="90" y="140" width="220" height="160" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="200" y="205" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">User</text>
  <text x="200" y="245" text-anchor="middle" fill="#1e3a8a" font-family="Segoe UI, Arial, sans-serif" font-size="20">Prompt</text>

  <path d="M310 220 H470" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="470" y="140" width="260" height="160" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="600" y="205" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Chat Client</text>
  <text x="600" y="245" text-anchor="middle" fill="#166534" font-family="Segoe UI, Arial, sans-serif" font-size="20">Routes intent</text>

  <path d="M730 220 H890" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="890" y="120" width="220" height="100" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="1000" y="170" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Weather</text>
  <text x="1000" y="200" text-anchor="middle" fill="#92400e" font-family="Segoe UI, Arial, sans-serif" font-size="18">get_current_weather</text>

  <rect x="890" y="250" width="220" height="100" rx="18" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="1000" y="300" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Summary</text>
  <text x="1000" y="330" text-anchor="middle" fill="#9d174d" font-family="Segoe UI, Arial, sans-serif" font-size="18">summarize_article</text>

  <path d="M600 300 L600 430" stroke="#475569" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="430" y="430" width="340" height="150" rx="22" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="600" y="490" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">Local .NET Functions</text>
  <text x="600" y="530" text-anchor="middle" fill="#312e81" font-family="Segoe UI, Arial, sans-serif" font-size="20">Weather + summarization logic</text>
